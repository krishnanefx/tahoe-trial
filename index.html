<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Private dashboard</title>
<style>
:root { color-scheme: light; --bg: #f4f3f0; --card: #fcfcfb; --line: #e3e1dc; --fg: #0b0b0b; --muted: #6b6a65; --accent: #2a78d6; --bad: #c62828; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #121211; --card: #1a1a19; --line: #2e2e2c; --fg: #ffffff; --muted: #a3a29a; --accent: #3987e5; --bad: #f85149; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
form { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 12px; }
h1 { font-size: 18px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 13px; }
label { font-size: 13px; color: var(--muted); }
input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; padding: 9px 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#msg { min-height: 18px; color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Private dashboard</h1>
  <p>This page is encrypted. Enter the password you were sent to open it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Open dashboard</button>
  <div id="msg" role="status"></div>
</form>
